---
- name: Configure web server
  hosts: all
  become: true

  vars:
    nginx_port: 80
    apache_port: 8080

  tasks:
    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Ensure Nginx is running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Install Apache
      ansible.builtin.apt:
        name: apache2
        state: present
        update_cache: true

    - name: Configure Apache to listen on port 8080
      ansible.builtin.lineinfile:
        path: /etc/apache2/ports.conf
        regexp: "^Listen 80$"
        line: "Listen 8080"
      notify: Restart Apache

    - name: Ensure Apache is running
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: true

    - name: Configure Nginx reverse proxy
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/sites-available/default
        mode: "0644"
      notify: Restart Nginx

  handlers:
    - name: Restart Apache
      ansible.builtin.service:
        name: apache2
        state: restarted

    - name: Restart Nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
